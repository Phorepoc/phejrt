# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): the Java runtime (phoneME CLDC-HI +
# MIDP 2.1 with our javacall port) and a demo MIDlet suite that depends on it. Both come from recipes/sis.sh.
NAME=phejrt
ARCHES="x32"
REPOS_x32=""
COMPONENTS_x32="phejlaunch phemidp_sis"
# the add-on archive is of no use (the files are packaged by recipes/j5-pack.py): the SIS files are the product
ADDON=0
